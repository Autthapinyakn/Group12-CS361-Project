<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ตรวจสอบการสำเร็จการศึกษา | Computer Science TU</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&family=Sarabun:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header id="site-header"></header>

  <main id="main" class="page">
    <div class="container">
      <div class="page-head">
        <span class="eyebrow">Graduation check</span>
        <h1>ตรวจสอบการสำเร็จการศึกษา</h1>
        <p>ตรวจสอบหน่วยกิต หมวดวิชา ค่าระดับเฉลี่ย ระยะเวลาการศึกษา และหนี้สินค้างชำระ ตามเงื่อนไขของหลักสูตร จากข้อมูลผลการเรียนที่สำนักทะเบียนส่งมาล่าสุด</p>
      </div>
      <div id="page-status" hidden></div>
      <div id="audit" class="stack" aria-live="polite">
        <div class="card"><div class="skeleton"></div><br /><div class="skeleton"></div></div>
      </div>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <script type="module">
    import { initLayout, guard } from './layout.js';
    import { apiGet, errorMessage, ApiError } from './api.js';
    import { setStatus, formatDateTime, h } from './ui.js';
    import { renderAudit } from './gradAudit.js';

    initLayout();
    const main = document.getElementById('main');
    if (guard(main, ['student'])) {
      const audit = document.getElementById('audit');
      const status = document.getElementById('page-status');
      try {
        const { data } = await apiGet('/graduation/me', { auth: true, retries: 1 });
        renderAudit(audit, data);
      } catch (err) {
        audit.replaceChildren();
        if (err instanceof ApiError && err.status === 404) {
          const latest = err.details?.body?.latestImport;
          setStatus(status, 'warn', 'ยังไม่พบข้อมูลผลการเรียนของบัญชีนี้',
            'ระบบไม่พบรายชื่อของคุณในข้อมูลที่สำนักทะเบียนส่งมา จึงยังตรวจสอบการสำเร็จการศึกษาให้ไม่ได้',
            latest ? `ข้อมูลล่าสุดที่นำเข้าเป็นของภาค ${latest.asOfTerm} (นำเข้าเมื่อ ${formatDateTime(latest.createdAt)})` : 'ยังไม่มีการนำเข้าข้อมูลจากสำนักทะเบียน',
            'หากคุณเป็นนักศึกษาของหลักสูตร กรุณาติดต่อเจ้าหน้าที่ฝ่ายทะเบียนของสาขา โดยแจ้งอีเมลที่ใช้เข้าสู่ระบบ');
        } else {
          setStatus(status, 'danger', 'โหลดข้อมูลไม่สำเร็จ', errorMessage(err),
            h('button', { type: 'button', class: 'btn btn-secondary btn-sm', onclick: () => location.reload() }, 'ลองใหม่'));
        }
      }
    }
  </script>
</body>
</html>
