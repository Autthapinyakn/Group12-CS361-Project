<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>สถานะการสำเร็จการศึกษาของนักศึกษา | Computer Science TU</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&family=Sarabun:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header id="site-header"></header>

  <main id="main" class="page">
    <div class="container stack">
      <div class="page-head">
        <span class="eyebrow">Advisee status</span>
        <h1>สถานะการสำเร็จการศึกษาของนักศึกษา</h1>
        <p id="scope-text">ตรวจสอบสถานะการสำเร็จการศึกษาของนักศึกษา จากข้อมูลที่สำนักทะเบียนส่งมาล่าสุด</p>
      </div>

      <div id="import-status" hidden></div>

      <section class="card stack" aria-labelledby="list-title">
        <div class="section-title">
          <h2 id="list-title">รายชื่อนักศึกษา</h2>
          <div class="row"><span class="small muted" id="list-count"></span></div>
        </div>
        <form class="qa-box" id="search-form" role="search">
          <label class="search">
            <span class="visually-hidden">ค้นหาด้วยรหัสหรือชื่อนักศึกษา</span>
            <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
            <input class="input" id="search" type="search" placeholder="ค้นหาด้วยรหัสนักศึกษาหรือชื่อ" autocomplete="off" maxlength="100" />
          </label>
          <button class="btn btn-secondary" type="submit">ค้นหา</button>
        </form>
        <div id="list-status" hidden></div>
        <div class="table-wrap">
          <table class="table">
            <thead>
              <tr>
                <th scope="col">รหัสนักศึกษา</th>
                <th scope="col">ชื่อ-นามสกุล</th>
                <th scope="col">หลักสูตร / แผน</th>
                <th scope="col">ปีที่เข้า</th>
                <th scope="col">ข้อมูล ณ ภาค</th>
                <th scope="col"><span class="visually-hidden">ดูผล</span></th>
              </tr>
            </thead>
            <tbody id="students"></tbody>
          </table>
        </div>
      </section>

      <section id="detail" class="stack" aria-live="polite" hidden>
        <div class="row row--between">
          <h2 class="section-title" id="detail-title">ผลการตรวจสอบ</h2>
          <button class="btn btn-secondary btn-sm" type="button" id="back-to-list"><i class="fa-solid fa-arrow-up" aria-hidden="true"></i> กลับไปที่รายชื่อ</button>
        </div>
        <div id="detail-status" hidden></div>
        <div id="audit" class="stack"></div>
      </section>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <script type="module">
    import { initLayout, guard } from './layout.js';
    import { apiGet, errorMessage, ApiError, curriculumName } from './api.js';
    import { h, icon, setStatus, formatDateTime, loadingRows, badge } from './ui.js';
    import { renderAudit } from './gradAudit.js';

    const PLAN_LABELS = { 'โครงงาน': 'โครงงานพิเศษ', 'สหกิจศึกษา': 'สหกิจศึกษา' };
    const user = initLayout();
    const main = document.getElementById('main');

    // Students have their own page; send them there instead of showing "no permission".
    if (user && user.roles.has('student') && !user.roles.has('instructor') && !user.roles.has('staff')) {
      window.location.replace('graduation-requirements.html');
    } else if (guard(main, ['instructor', 'staff'])) {
      const tbody = document.getElementById('students');
      const listStatus = document.getElementById('list-status');
      const detail = document.getElementById('detail');
      const audit = document.getElementById('audit');
      const detailStatus = document.getElementById('detail-status');
      let selectedCode = null;

      async function loadList(q = '') {
        tbody.replaceChildren(...loadingRows(6));
        listStatus.hidden = true;
        try {
          const { data } = await apiGet(`/graduation/students${q ? `?q=${encodeURIComponent(q)}` : ''}`, { auth: true, retries: 1 });
          document.getElementById('scope-text').textContent = data.scope === 'all'
            ? 'เจ้าหน้าที่: ค้นหาและตรวจสอบนักศึกษาได้ทุกคน (แสดงสูงสุด 200 รายการ)'
            : 'อาจารย์ที่ปรึกษา: แสดงเฉพาะนักศึกษาที่อยู่ในความดูแลของคุณตามข้อมูลสำนักทะเบียน';
          showImportStatus(data.latestImport);
          document.getElementById('list-count').textContent = `${data.students.length} คน`;
          if (!data.students.length) {
            tbody.replaceChildren(h('tr', {}, h('td', { colspan: 6 }, h('div', { class: 'empty' }, icon('users-slash'),
              q ? 'ไม่พบนักศึกษาที่ตรงกับคำค้น'
                : data.scope === 'all' ? 'ยังไม่มีข้อมูลนักศึกษาในระบบ กรุณานำเข้าข้อมูลจากสำนักทะเบียนก่อน'
                : 'ไม่พบนักศึกษาในความดูแล ตรวจสอบว่าอีเมลอาจารย์ที่ปรึกษาในข้อมูลสำนักทะเบียนตรงกับบัญชีที่ใช้เข้าสู่ระบบ'))));
            return;
          }
          tbody.replaceChildren(...data.students.map(row));
        } catch (err) {
          tbody.replaceChildren();
          setStatus(listStatus, 'danger', 'โหลดรายชื่อไม่สำเร็จ', errorMessage(err),
            h('button', { type: 'button', class: 'btn btn-secondary btn-sm', onclick: () => loadList(q) }, 'ลองใหม่'));
        }
      }

      function showImportStatus(latest) {
        const el = document.getElementById('import-status');
        if (!latest) {
          setStatus(el, 'warn', 'ยังไม่มีข้อมูลจากสำนักทะเบียน', 'ระบบยังตรวจสอบการสำเร็จการศึกษาไม่ได้จนกว่าเจ้าหน้าที่จะนำเข้าข้อมูลผลการเรียน');
          return;
        }
        setStatus(el, latest.status === 'partial' ? 'warn' : 'info',
          `ข้อมูลสำนักทะเบียนล่าสุด: ภาคการศึกษา ${latest.asOfTerm}`,
          `นำเข้าเมื่อ ${formatDateTime(latest.createdAt)}${latest.status === 'partial' ? ' · ไฟล์ล่าสุดมีบางรายการไม่ผ่านการตรวจสอบ ข้อมูลของนักศึกษาบางคนอาจยังเป็นชุดเก่า' : ''}`);
      }

      function row(s) {
        const open = () => openStudent(s.studentCode);
        return h('tr', { class: 'is-clickable', onclick: open, 'aria-selected': String(s.studentCode === selectedCode) },
          h('td', { class: 'code' }, s.studentCode),
          h('td', {}, s.fullName),
          h('td', {}, curriculumName(s.curriculumCode), h('div', { class: 'small muted' }, PLAN_LABELS[s.plan] ?? s.plan ?? '-')),
          h('td', {}, s.enrollmentYear ?? '-'),
          h('td', {}, s.dataAsOf ?? badge('warn', 'ไม่มีข้อมูล')),
          h('td', { class: 'num' }, h('button', {
            type: 'button', class: 'btn btn-secondary btn-sm',
            'aria-label': `ดูผลการตรวจสอบของ ${s.studentCode}`,
            onclick: (e) => { e.stopPropagation(); open(); },
          }, 'ดูผล')));
      }

      async function openStudent(code) {
        selectedCode = code;
        detail.hidden = false;
        detailStatus.hidden = true;
        audit.replaceChildren(h('div', { class: 'card' }, h('div', { class: 'skeleton' })));
        history.replaceState(null, '', `?student=${code}`);
        detail.scrollIntoView({ behavior: 'smooth', block: 'start' });
        try {
          const { data } = await apiGet(`/graduation/students/${encodeURIComponent(code)}`, { auth: true, retries: 1 });
          renderAudit(audit, data);
        } catch (err) {
          audit.replaceChildren();
          if (err instanceof ApiError && err.status === 404) {
            setStatus(detailStatus, 'warn', `ไม่พบข้อมูลของนักศึกษารหัส ${code}`,
              'สำนักทะเบียนยังไม่ได้ส่งข้อมูลของนักศึกษาคนนี้ หรือรหัสนักศึกษาไม่ถูกต้อง');
          } else if (err instanceof ApiError && err.status === 403) {
            setStatus(detailStatus, 'danger', 'ไม่มีสิทธิ์ดูข้อมูลนักศึกษาคนนี้', 'อาจารย์ดูได้เฉพาะนักศึกษาที่อยู่ในความดูแลของตนเท่านั้น');
          } else {
            setStatus(detailStatus, 'danger', 'โหลดผลการตรวจสอบไม่สำเร็จ', errorMessage(err),
              h('button', { type: 'button', class: 'btn btn-secondary btn-sm', onclick: () => openStudent(code) }, 'ลองใหม่'));
          }
        }
      }

      document.getElementById('search-form').addEventListener('submit', (e) => {
        e.preventDefault();
        loadList(document.getElementById('search').value.trim());
      });
      document.getElementById('back-to-list').addEventListener('click', () => {
        detail.hidden = true;
        history.replaceState(null, '', location.pathname);
        document.getElementById('search').focus();
      });

      await loadList();
      const deepLink = new URLSearchParams(location.search).get('student');
      if (deepLink && /^\d{10}$/.test(deepLink)) openStudent(deepLink);
    }
  </script>
</body>
</html>
